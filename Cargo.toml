[package]
name = "brainmux-companion"
version = "0.1.0"
edition = "2021"
description = "brainmux Companion — tiny Rust bootstrapper: filesystem provision + Zero-State auto-provision + run the local core (ADR-0011)."

[[bin]]
name = "brainmux"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }   # tiny blocking HTTP (Ollama + CDN); no async runtime
serde_json = "1"                                # manifest + Ollama stream parsing
ctrlc = "3"                                      # clean teardown (no orphans)
libc = "0.2"                                     # kill child process GROUP on exit (no orphans)

# Tiny binary: optimize for size + strip.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
