[package]
name = "brainmux-companion"
version = "0.1.0"
description = "brainmux Companion — local runtime desktop app (Tauri shell + local core)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-log = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
libc = "0.2"                                      # process-group teardown (no orphans)
ureq = { version = "2", features = ["json"] }     # health/ollama probes + model pull
